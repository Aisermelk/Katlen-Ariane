<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Katlen Ariane</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { --sky:#4FA8D8; --sky-deep:#2E7DA6; --ink:#1E3A45; --bg:#FAFBFC; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Inter, sans-serif; background: var(--bg); color: var(--ink); margin:0; padding: 40px 20px; }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 24px; }
  fieldset { border: 1px solid #E3EDF2; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  legend { font-weight: 600; padding: 0 8px; color: var(--sky-deep); }
  label { display:block; font-size: 0.85rem; margin: 12px 0 4px; }
  input[type=text], input[type=password] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.95rem; }
  .toggle-row { display:flex; align-items:center; gap:8px; margin-top: 10px; }
  button { background: var(--sky-deep); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; }
  #msg { margin: 12px 0; font-size: 0.9rem; }
  #login-view, #panel-view { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Admin — Katlen Ariane</h1>
  <div id="msg"></div>

  <div id="login-view">
    <fieldset>
      <legend>Login</legend>
      <label>Usuário</label>
      <input type="text" id="login-user">
      <label>Senha</label>
      <input type="password" id="login-pass">
      <button id="btn-login">Entrar</button>
    </fieldset>
  </div>

  <div id="panel-view">
    <fieldset>
      <legend>Contato</legend>
      <label>WhatsApp (só números, com DDI+DDD)</label>
      <input type="text" id="whatsapp" placeholder="5511999999999">
      <label>Endereço</label>
      <input type="text" id="endereco" placeholder="Rua Exemplo, 123 - Bairro, Cidade - UF">
      <label>Formspree ID</label>
      <input type="text" id="formspreeEndpoint">
    </fieldset>

    <fieldset>
      <legend>Redes sociais</legend>
      <label>Instagram</label><input type="text" id="instagram">
      <label>Facebook</label><input type="text" id="facebook">
      <label>TikTok</label><input type="text" id="tiktok">
      <label>LinkedIn</label><input type="text" id="linkedin">
    </fieldset>

    <fieldset>
      <legend>Informações profissionais</legend>
      <label>Registro profissional (CRP)</label>
      <input type="text" id="professionalRegistration" placeholder="CBPC 2022-6172">
      <label>Formação</label><input type="text" id="formacao">
      <label>Especializações</label><input type="text" id="especializacoes">
      <label>Experiência</label><input type="text" id="experiencia">
    </fieldset>

    <fieldset>
      <legend>Rastreamento</legend>
      <label>Meta Pixel ID</label>
      <input type="text" id="metaPixelId">
      <div class="toggle-row"><input type="checkbox" id="pixelEnabled"><label style="margin:0">Ativar Pixel</label></div>

      <label>Google Analytics (Measurement ID)</label>
      <input type="text" id="gaMeasurementId">
      <div class="toggle-row"><input type="checkbox" id="gaEnabled"><label style="margin:0">Ativar GA</label></div>

      <label>Google Tag Manager ID</label>
      <input type="text" id="gtmId">
      <div class="toggle-row"><input type="checkbox" id="gtmEnabled"><label style="margin:0">Ativar GTM</label></div>
    </fieldset>

    <button id="btn-save">Salvar alterações</button>
    <button id="btn-logout" style="background:#94a3b8;margin-left:10px;">Sair</button>
  </div>
</div>

<script>
const API = ""; // mesma origem do Worker

function showMsg(text, isError) {
  const el = document.getElementById("msg");
  el.textContent = text;
  el.style.color = isError ? "#dc2626" : "#16a34a";
}

async function tryLoadPanel() {
  const res = await fetch(`${API}/api/admin/config`, { credentials: "include" });
  if (!res.ok) {
    document.getElementById("login-view").style.display = "block";
    return;
  }
  const config = await res.json();
  fillForm(config);
  document.getElementById("panel-view").style.display = "block";
}

function fillForm(c) {
  document.getElementById("whatsapp").value = c.whatsapp || "";
  document.getElementById("endereco").value = c.endereco || "";
  document.getElementById("formspreeEndpoint").value = c.formspreeEndpoint || "";
  document.getElementById("instagram").value = c.instagram || "";
  document.getElementById("facebook").value = c.facebook || "";
  document.getElementById("tiktok").value = c.tiktok || "";
  document.getElementById("linkedin").value = c.linkedin || "";
  document.getElementById("professionalRegistration").value = c.professionalRegistration || "CBPC 2022-6172";
  document.getElementById("formacao").value = c.formacao || "";
  document.getElementById("especializacoes").value = c.especializacoes || "";
  document.getElementById("experiencia").value = c.experiencia || "";
  document.getElementById("metaPixelId").value = c.metaPixelId || "";
  document.getElementById("gaMeasurementId").value = c.gaMeasurementId || "";
  document.getElementById("gtmId").value = c.gtmId || "";
  document.getElementById("pixelEnabled").checked = !!c.trackingEnabled?.pixel;
  document.getElementById("gaEnabled").checked = !!c.trackingEnabled?.ga;
  document.getElementById("gtmEnabled").checked = !!c.trackingEnabled?.gtm;
}

document.getElementById("btn-login").addEventListener("click", async () => {
  const username = document.getElementById("login-user").value;
  const password = document.getElementById("login-pass").value;
  const res = await fetch(`${API}/api/login`, {
    method: "POST",
    credentials: "include",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password })
  });
  if (res.ok) {
    showMsg("Login realizado.");
    document.getElementById("login-view").style.display = "none";
    tryLoadPanel();
  } else {
    const data = await res.json();
    showMsg(data.error || "Falha no login.", true);
  }
});

document.getElementById("btn-save").addEventListener("click", async () => {
  const payload = {
    whatsapp: document.getElementById("whatsapp").value,
    endereco: document.getElementById("endereco").value,
    formspreeEndpoint: document.getElementById("formspreeEndpoint").value,
    instagram: document.getElementById("instagram").value,
    facebook: document.getElementById("facebook").value,
    tiktok: document.getElementById("tiktok").value,
    linkedin: document.getElementById("linkedin").value,
    professionalRegistrationLabel: "Registro profissional",
    professionalRegistration: document.getElementById("professionalRegistration").value || "CBPC 2022-6172",
    formacao: document.getElementById("formacao").value,
    especializacoes: document.getElementById("especializacoes").value,
    experiencia: document.getElementById("experiencia").value,
    metaPixelId: document.getElementById("metaPixelId").value,
    gaMeasurementId: document.getElementById("gaMeasurementId").value,
    gtmId: document.getElementById("gtmId").value,
    trackingEnabled: {
      pixel: document.getElementById("pixelEnabled").checked,
      ga: document.getElementById("gaEnabled").checked,
      gtm: document.getElementById("gtmEnabled").checked
    }
  };
  const res = await fetch(`${API}/api/admin/config`, {
    method: "PUT",
    credentials: "include",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  showMsg(res.ok ? "Salvo com sucesso." : "Erro ao salvar.", !res.ok);
});

document.getElementById("btn-logout").addEventListener("click", async () => {
  await fetch(`${API}/api/logout`, { method: "POST", credentials: "include" });
  location.reload();
});

tryLoadPanel();
</script>
</body>
</html>
